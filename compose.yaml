# docker compose up -d   ->  http://localhost:8000
# Put HTTPS in front of it (Caddy, nginx, the college's proxy) before opening
# it to students, then set TTGEN_SECURE_COOKIES=1.
services:
  timetable:
    build: .
    image: timetable:1.0.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - timetable-data:/var/lib/timetable

volumes:
  timetable-data:
