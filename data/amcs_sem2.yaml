  - {id: J511, kind: lab, capacity: 30, building: J, facilities: [python, cpp, jdk]}
  - {id: J512, kind: lab, capacity: 30, building: J, facilities: [python, cpp, jdk]}
  - {id: J513, kind: lab, capacity: 30, building: J, facilities: [python, cpp, jdk]}
