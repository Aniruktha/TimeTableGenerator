# AMCS department, PSG College of Technology -- Semester 2, even term 2025-26.
#
# This is the MVP slice: all four M.Sc. branches at the same semester, sharing
# one faculty pool and one room pool.  Courses, hours, staff assignments and
# room codes are transcribed from the published timetable (TT_even_25-26.pdf).
#
# Why this slice: the four Sem-2 classes share 8 staff members between them
# (see `uv run tt workload`), so a solution has to resolve real cross-branch
# conflicts.  Scheduling one branch alone would be trivial and would prove
# nothing.

name: AMCS Semester 2 (even 2025-26)

grid:
  days: [MON, TUE, WED, THU, FRI]
  periods:
    - {id: 1, start: "08:30", end: "09:20"}
    - {id: 2, start: "09:20", end: "10:10"}   # 20-min break follows
    - {id: 3, start: "10:30", end: "11:20"}
    - {id: 4, start: "11:20", end: "12:10"}   # lunch follows
    - {id: 5, start: "13:40", end: "14:30"}
    - {id: 6, start: "14:30", end: "15:20"}   # 10-min break follows
    - {id: 7, start: "15:30", end: "16:20"}
    - {id: 8, start: "16:20", end: "17:10"}
  # A two-period lab may only occupy one of these pairs, so it never runs
  # across a break.
  blocks: [[1, 2], [3, 4], [5, 6], [7, 8]]

# College-wide holds (assembly, department meeting).  None this term.
blocked_slots: []

rooms:
  # -- lecture halls --
  - {id: M201, kind: classroom, capacity: 70, building: M}
  - {id: M202, kind: classroom, capacity: 70, building: M}
  - {id: M503, kind: classroom, capacity: 70, building: M}
  - {id: M504, kind: classroom, capacity: 70, building: M}
