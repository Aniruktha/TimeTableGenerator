[project]
name = "ttgen"
version = "1.0.0"
description = "College timetable generator: CP-SAT solver, web builder, and sign-in portal for admins, teachers and students"
readme = "README.md"
authors = [
    { name = "Aniruktha", email = "aniruktha@trainery.one" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "ortools>=9.15.6755",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
tt = "ttgen.cli:main"
