[project]
name = "ttgen"
version = "0.1.0"
description = "CP-SAT timetable generator for the AMCS department, PSG College of Technology"
readme = "README.md"
authors = [
    { name = "Aniruktha", email = "aniruktha@trainery.one" }
]
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15.6755",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
tt = "ttgen.cli:main"
