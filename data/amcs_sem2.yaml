# Penalties, all relative to each other.  Raise `student_gap` to buy compact
# student days at the cost of everything else; raise `staff_days` to make
# visiting faculty come in less often.
weights:
  student_gap: 40
  staff_gap: 8
  staff_days: 5
  late_period: 3
  adjacent_days: 2
  load_imbalance: 4
  room_churn: 1
  two_labs_per_day: 6
  early_lab: 0
